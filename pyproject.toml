[project]
name = "spyglass"
version = "0.1.0"
description = "Render GGUF weight tensors as grayscale heatmap PNGs"
requires-python = ">=3.9"
dependencies = [
    "gguf>=0.13",
    "numpy>=1.24",
    "pillow>=10",
]

[project.scripts]
spyglass = "spyglass.cli:main"
spyglass-view = "spyglass.viewer.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spyglass"]
